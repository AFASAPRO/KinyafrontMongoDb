    <!-- Pre-paint theme (prevents a dark/light flash before Vue mounts) -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('kb_mode') || 'dark'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark)
          if (!isDark) document.documentElement.classList.add('light-mode')
        } catch (e) {}
      })()
    </script>
    <style>
      /* ── Boot splash: paints instantly (no JS wait) and is replaced
            by Vue on mount. Guarantees there is never a black/blank
            first screen — even on slow networks or cold PWA starts. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #070A12;
      }
      html.light-mode #boot-splash { background: #F8FAFC; }
      #boot-splash img {
        width: 56px; height: 56px; border-radius: 14px; object-fit: contain;
        box-shadow: 0 0 30px rgba(99,102,241,.35);
        animation: bsPulse 1.6s ease-in-out infinite;
      }
      #boot-splash .bs-name {
        color: #F8FAFC; font-size: 15px; font-weight: 600;
        font-family: 'Inter', system-ui, sans-serif; letter-spacing: .02em;
      }
      html.light-mode #boot-splash .bs-name { color: #0F172A; }
      #boot-splash .bs-spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2.5px solid rgba(255,255,255,.12); border-top-color: #6366F1;
        animation: bsSpin .8s linear infinite;
      }
      html.light-mode #boot-splash .bs-spinner { border-color: rgba(0,0,0,.1); border-top-color: #4F46E5; }
      @keyframes bsSpin { to { transform: rotate(360deg) } }
      @keyframes bsPulse { 0%,100% { opacity:.85 } 50% { opacity:1; transform:scale(1.05) } }
    </style>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <div class="bs-spinner"></div>
